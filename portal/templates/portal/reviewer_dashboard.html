{% extends 'portal/base.html' %}

{% block content %}
<h2>Reviewer Dashboard</h2>

{% for paper in papers %}
    <h3>{{ paper.title }}</h3>
    <p>Uploaded by: {{ paper.uploaded_by.username }}</p>
    <a href="{{ paper.file.url }}">View Paper</a><br>
    <a href="{% url 'review' paper.id %}">Give Feedback</a>
    <hr>
{% empty %}
    <p>No research papers uploaded.</p>
{% endfor %}

<form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
{% endblock %}
